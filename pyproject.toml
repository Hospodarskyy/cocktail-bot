[project]
name = "cocktail-recommender"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "pydantic",
    "sentence-transformers",
    "psycopg2-binary",
    "pgvector",
    "pandas",
    "uvicorn",
    "tqdm",
    "requests>=2.34.2",
    "python-telegram-bot>=22.8",
    "python-dotenv>=1.2.2",
    "anthropic>=0.113.0",
    "openai>=2.44.0",
    "boto3>=1.34.0",
    "mlflow>=2.14.0",
    "implicit>=0.7.2",
    "scipy",
    "joblib",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true